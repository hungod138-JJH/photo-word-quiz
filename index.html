<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포토워드 - 사진으로 만드는 영어단어 퀴즈</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A9BDC">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="포토워드">
<style>
  :root {
    --sky: #3A9BDC;
    --sky-dark: #2678AE;
    --sunny: #FFC93C;
    --coral: #FF6B6B;
    --grass: #4CAF6D;
    --ink: #26324A;
    --paper: #F7FAFD;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .app {
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 18px 60px;
  }
  header {
    text-align: left;
    padding: 18px 4px 22px;
  }
  header .badge {
    display: inline-block;
    background: var(--sunny);
    color: var(--ink);
    font-weight: 800;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
  }
  header p {
    margin: 0;
    color: #5A6B85;
    font-size: 15px;
    line-height: 1.5;
  }

  .camera-box {
    background: var(--white);
    border-radius: 22px;
    padding: 26px 20px;
    box-shadow: 0 10px 30px rgba(38,50,74,0.08);
    text-align: center;
    border: 2px dashed #CFE0F0;
  }
  .camera-box.has-image {
    border-style: solid;
    border-color: var(--sky);
    padding: 16px;
  }
  .camera-icon {
    font-size: 40px;
    margin-bottom: 6px;
  }
  .camera-box h3 {
    margin: 6px 0 4px;
    font-size: 17px;
  }
  .camera-box p {
    margin: 0 0 16px;
    color: #7A8AA3;
    font-size: 13.5px;
  }
  #preview {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 14px;
    display: none;
    margin-bottom: 14px;
  }
  input[type="file"] { display: none; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: 14px;
    padding: 14px 22px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--sky);
    color: var(--white);
  }
  .btn-primary:hover { background: var(--sky-dark); }
  .btn-secondary {
    background: #EEF3F9;
    color: var(--ink);
    margin-top: 10px;
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .status {
    text-align: center;
    padding: 30px 0;
    color: #5A6B85;
    font-size: 14.5px;
  }
  .spinner {
    width: 30px;
    height: 30px;
    margin: 0 auto 14px;
    border: 3px solid #E3ECF6;
    border-top-color: var(--sky);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .word-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0 4px;
  }
  .chip {
    background: #EAF4FF;
    color: var(--sky-dark);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
  }

  .quiz-card {
    background: var(--white);
    border-radius: 22px;
    padding: 24px 20px;
    box-shadow: 0 10px 30px rgba(38,50,74,0.08);
    margin-top: 18px;
  }
  .quiz-progress {
    font-size: 13px;
    font-weight: 700;
    color: var(--sky-dark);
    margin-bottom: 10px;
  }
  .quiz-word {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .quiz-question {
    font-size: 14.5px;
    color: #5A6B85;
    margin-bottom: 18px;
  }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #F7FAFD;
    border: 2px solid #E3ECF6;
    border-radius: 14px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .option:hover { border-color: var(--sky); }
  .option.correct {
    background: #E9F7EE;
    border-color: var(--grass);
    color: #256B3E;
  }
  .option.wrong {
    background: #FDEBEB;
    border-color: var(--coral);
    color: #A33636;
  }
  .option:disabled { cursor: default; }

  .result-box {
    text-align: center;
    padding: 20px 0 6px;
  }
  .result-score {
    font-size: 44px;
    font-weight: 800;
    color: var(--sky-dark);
    margin: 6px 0 2px;
  }
  .result-label {
    color: #5A6B85;
    font-size: 14.5px;
    margin-bottom: 20px;
  }
  .error-box {
    background: #FDEBEB;
    color: #A33636;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 13.5px;
    margin-top: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="badge">포토워드</span>
    <h1>사진 한 장, 단어 퀴즈 한 판</h1>
    <p>영어 단어가 적힌 책이나 프린트물을 찍으면, 그 단어들로 바로 문제를 만들어줘요.</p>
  </header>

  <div id="cameraBox" class="camera-box">
    <div id="cameraIdle">
      <div class="camera-icon">📷</div>
      <h3>단어 사진을 올려주세요</h3>
      <p>교과서, 단어장, 프린트물 모두 좋아요</p>
    </div>
    <img id="preview" alt="업로드한 사진 미리보기">
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <button class="btn btn-primary" id="pickBtn">📸 사진 찍기 / 선택하기</button>
    <button class="btn btn-primary" id="generateBtn" style="display:none;">✏️ 이 사진으로 문제 만들기</button>
    <button class="btn btn-secondary" id="retakeBtn" style="display:none;">다른 사진 선택하기</button>
  </div>

  <div id="statusArea"></div>
  <div id="quizArea"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const pickBtn = document.getElementById('pickBtn');
const generateBtn = document.getElementById('generateBtn');
const retakeBtn = document.getElementById('retakeBtn');
const cameraBox = document.getElementById('cameraBox');
const cameraIdle = document.getElementById('cameraIdle');
const preview = document.getElementById('preview');
const statusArea = document.getElementById('statusArea');
const quizArea = document.getElementById('quizArea');

let imageBase64 = null;
let imageMediaType = null;
let quizData = null;
let currentQ = 0;
let score = 0;

pickBtn.addEventListener('click', () => fileInput.click());
retakeBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  imageMediaType = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = () => {
    imageBase64 = reader.result.split(',')[1];
    preview.src = reader.result;
    preview.style.display = 'block';
    cameraIdle.style.display = 'none';
    pickBtn.style.display = 'none';
    generateBtn.style.display = 'flex';
    retakeBtn.style.display = 'flex';
    cameraBox.classList.add('has-image');
    quizArea.innerHTML = '';
    statusArea.innerHTML = '';
  };
  reader.readAsDataURL(file);
});

generateBtn.addEventListener('click', generateQuiz);

async function generateQuiz() {
  generateBtn.disabled = true;
  retakeBtn.disabled = true;
  statusArea.innerHTML = `
    <div class="status">
      <div class="spinner"></div>
      사진 속 단어를 읽고 문제를 만드는 중이에요...
    </div>`;
  quizArea.innerHTML = '';

  const prompt = `이 이미지에는 아이가 공부하는 영어 단어들이 있습니다.
1) 이미지에서 명확히 보이는 영어 단어를 최대 6개까지 찾으세요.
2) 각 단어의 뜻(한국어)을 묻는 객관식 문제를 만드세요. 보기는 4개, 그중 정답 1개와 그럴듯한 오답 3개.
3) 다른 설명 없이 아래 JSON 형식으로만 답하세요.

{"words": ["word1", "word2"], "questions": [{"word": "word1", "question": "'word1'의 뜻은 무엇일까요?", "options": ["뜻1", "뜻2", "뜻3", "뜻4"], "answer": 0}]}`;

  try {
    const response = await fetch("/api/generate-quiz", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        imageBase64: imageBase64,
        mediaType: imageMediaType,
        prompt: prompt
      })
    });

    if (!response.ok) {
      const errBody = await response.json().catch(() => ({}));
      throw new Error(errBody.error || `서버 오류 (${response.status})`);
    }

    const parsed = await response.json();

    if (!parsed.questions || parsed.questions.length === 0) {
      throw new Error('사진에서 단어를 찾지 못했어요. 더 선명한 사진으로 시도해보세요.');
    }

    quizData = parsed;
    currentQ = 0;
    score = 0;
    statusArea.innerHTML = `<div class="word-chips">${parsed.words.map(w => `<span class="chip">${escapeHtml(w)}</span>`).join('')}</div>`;
    renderQuestion();
  } catch (err) {
    statusArea.innerHTML = `<div class="error-box">문제를 만들지 못했어요: ${escapeHtml(err.message || String(err))}<br>사진이 선명한지 확인하고 다시 시도해주세요.</div>`;
  } finally {
    generateBtn.disabled = false;
    retakeBtn.disabled = false;
  }
}

function renderQuestion() {
  const q = quizData.questions[currentQ];
  const total = quizData.questions.length;
  quizArea.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress">문제 ${currentQ + 1} / ${total}</div>
      <div class="quiz-word">${escapeHtml(q.word)}</div>
      <div class="quiz-question">${escapeHtml(q.question)}</div>
      <div id="options"></div>
    </div>`;
  const optionsEl = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectOption(i));
    optionsEl.appendChild(btn);
  });
}

function selectOption(i) {
  const q = quizData.questions[currentQ];
  const buttons = document.querySelectorAll('#options .option');
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.answer) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  if (i === q.answer) score++;
  setTimeout(() => {
    currentQ++;
    if (currentQ < quizData.questions.length) {
      renderQuestion();
    } else {
      renderResult();
    }
  }, 900);
}

function renderResult() {
  const total = quizData.questions.length;
  quizArea.innerHTML = `
    <div class="quiz-card result-box">
      <div>수고했어요! 🎉</div>
      <div class="result-score">${score} / ${total}</div>
      <div class="result-label">맞힌 단어 개수예요</div>
      <button class="btn btn-primary" id="againBtn">같은 사진으로 다시 풀기</button>
    </div>`;
  document.getElementById('againBtn').addEventListener('click', generateQuiz);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
