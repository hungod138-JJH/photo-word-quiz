<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포토워드 - 사진으로 만드는 영어단어 퀴즈</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A9BDC">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="포토워드">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<style>
  :root {
    --sky: #3A9BDC; --sky-dark: #2678AE; --sunny: #FFC93C;
    --coral: #FF6B6B; --grass: #4CAF6D; --ink: #26324A; --paper: #F7FAFD; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; }
  .app { max-width:460px; margin:0 auto; padding:20px 18px 60px; }
  header { padding:14px 4px 18px; }
  header .badge { display:inline-block; background:var(--sunny); color:var(--ink); font-weight:800; font-size:13px; padding:4px 10px; border-radius:20px; margin-bottom:8px; }
  header h1 { font-size:22px; font-weight:800; margin:0 0 4px; letter-spacing:-0.5px; }
  header p { margin:0; color:#5A6B85; font-size:14px; line-height:1.5; }

  .card { background:var(--white); border-radius:22px; padding:22px 20px; box-shadow:0 10px 30px rgba(38,50,74,0.08); margin-bottom:16px; }
  .big-btn { display:flex; align-items:center; gap:14px; background:var(--white); border:2px solid #E3ECF6; border-radius:18px; padding:18px 18px; margin-bottom:14px; cursor:pointer; text-align:left; width:100%; }
  .big-btn .icon { font-size:28px; }
  .big-btn .txt h3 { margin:0 0 3px; font-size:16px; }
  .big-btn .txt p { margin:0; font-size:12.5px; color:#7A8AA3; }
  .big-btn:active { transform:scale(0.98); }
  .big-btn.sky { border-color:var(--sky); }
  .big-btn.sunny { border-color:var(--sunny); }

  .btn { display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px; padding:14px 20px; font-size:15px; font-weight:700; cursor:pointer; width:100%; }
  .btn-primary { background:var(--sky); color:var(--white); }
  .btn-secondary { background:#EEF3F9; color:var(--ink); margin-top:10px; }
  .btn:disabled { opacity:.5; }

  input[type=file]{display:none;}
  input[type=text], textarea {
    width:100%; border:2px solid #E3ECF6; border-radius:12px; padding:12px 14px; font-size:15px;
    font-family:inherit; margin-bottom:12px; background:#F7FAFD;
  }
  label.field-label { font-size:12.5px; font-weight:700; color:#5A6B85; margin-bottom:6px; display:block; }

  #preview { width:100%; max-height:220px; object-fit:cover; border-radius:14px; margin-bottom:14px; }

  .status { text-align:center; padding:30px 0; color:#5A6B85; font-size:14px; }
  .spinner { width:30px; height:30px; margin:0 auto 14px; border:3px solid #E3ECF6; border-top-color:var(--sky); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }

  .word-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #EEF3F9; }
  .word-row .w { font-weight:700; }
  .word-row .e { color:#7A8AA3; font-size:12.5px; }
  .del-btn { background:none; border:none; color:var(--coral); font-size:13px; font-weight:700; cursor:pointer; }

  .progress-bar { height:8px; background:#E3ECF6; border-radius:6px; overflow:hidden; margin:10px 0 4px; }
  .progress-fill { height:100%; background:var(--sky); transition:width .2s ease; }

  .quiz-progress { font-size:12.5px; font-weight:700; color:var(--sky-dark); margin-bottom:8px; }
  .quiz-sentence { margin-bottom:20px; }
  .quiz-sentence-line { font-size:18px; font-weight:700; line-height:1.5; margin-bottom:10px; }
  .quiz-sentence-line:last-child { margin-bottom:0; }
  .blank { color:var(--sky-dark); border-bottom:3px solid var(--sky); padding:0 4px; }
  .option { display:block; width:100%; text-align:left; background:#F7FAFD; border:2px solid #E3ECF6; border-radius:14px; padding:13px 16px; margin-bottom:10px; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer; }
  .option.correct { background:#E9F7EE; border-color:var(--grass); color:#256B3E; }
  .option.wrong { background:#FDEBEB; border-color:var(--coral); color:#A33636; }
  .option:disabled { cursor:default; }

  .result-score { font-size:44px; font-weight:800; color:var(--sky-dark); margin:6px 0 2px; text-align:center; }
  .result-label { color:#5A6B85; font-size:14px; margin-bottom:20px; text-align:center; }
  .empty { text-align:center; color:#7A8AA3; font-size:14px; padding:20px 0; }
  .link-back { display:inline-block; margin-bottom:10px; color:var(--sky-dark); font-weight:700; font-size:13.5px; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="badge">포토워드</span>
    <h1>사진 한 장, 단어 퀴즈 한 판</h1>
    <p>완전 무료 · 인터넷 서버 없이 이 폰 안에서만 작동해요</p>
  </header>
  <div id="screen"></div>
</div>

<script>
const STORAGE_KEY = 'photoword_bank_v1';
let allWords = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let sessionWordIds = [];
let ocrRaw = '';
let quizList = [];
let quizIndex = 0;
let quizScore = 0;

function saveBank() { localStorage.setItem(STORAGE_KEY, JSON.stringify(allWords)); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function render(html) { document.getElementById('screen').innerHTML = html; }

function goHome() {
  render(`
    <div class="big-btn sky" onclick="goCapture()">
      <div class="icon">📷</div>
      <div class="txt"><h3>새 단어 사진 찍기</h3><p>단어와 예문이 있는 사진을 찍어요</p></div>
    </div>
    <div class="big-btn sunny" onclick="goQuizSetup()">
      <div class="icon">✏️</div>
      <div class="txt"><h3>퀴즈 풀기</h3><p>저장된 단어로 문제를 풀어요</p></div>
    </div>
    <div class="big-btn" onclick="goWordBank()">
      <div class="icon">📚</div>
      <div class="txt"><h3>저장된 단어 (${allWords.length}개)</h3><p>모아둔 단어를 확인하고 정리해요</p></div>
    </div>
  `);
}

function goCapture() {
  render(`
    <span class="link-back" onclick="goHome()">← 처음으로</span>
    <div class="card">
      <label class="field-label">단어가 보이는 사진을 찍어주세요</label>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📸 사진 찍기 / 선택하기</button>
    </div>
  `);
  document.getElementById('fileInput').addEventListener('change', onPhoto);
}

function onPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => runOcr(reader.result);
  reader.readAsDataURL(file);
}

function downscale(dataUrl, maxW) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  });
}

async function runOcr(dataUrl) {
  render(`
    <div class="card">
      <img id="preview" src="${dataUrl}">
      <div class="status">
        <div class="spinner"></div>
        <div id="ocrMsg">사진 속 글자를 읽는 중이에요...</div>
        <div class="progress-bar"><div class="progress-fill" id="ocrBar" style="width:0%"></div></div>
      </div>
    </div>
  `);
  const small = await downscale(dataUrl, 1000);
  try {
    const result = await Tesseract.recognize(small, 'eng', {
      logger: (m) => {
        if (m.status === 'recognizing text') {
          document.getElementById('ocrBar').style.width = Math.round(m.progress * 100) + '%';
        }
      }
    });
    ocrRaw = result.data.text.trim();
    showReview(dataUrl);
  } catch (err) {
    render(`
      <div class="card">
        <div class="empty">글자를 읽지 못했어요. 더 밝고 선명한 사진으로 다시 시도해주세요.</div>
        <button class="btn btn-secondary" onclick="goCapture()">다시 찍기</button>
      </div>
    `);
  }
}

function guessWordAndExampleFallback(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length === 0) return { word: '', example: '' };
  let wordLine = lines.find(l => l.split(/\s+/).length <= 2) || lines[0];
  const word = wordLine.replace(/[^a-zA-Z' ]/g, '').trim().split(/\s+/)[0] || '';
  const exampleLine = lines.find(l => l !== wordLine && l.split(/\s+/).length >= 3) || lines.join(' ');
  return { word, example: exampleLine };
}

function parseMultipleEntries(text) {
  const wordRegex = /\b([A-Za-z][A-Za-z'\-]{1,20})\s*\(\s*(v|n|adj|adv|prep|conj|pron|interj)\s*\)/gi;
  const words = [];
  let m;
  while ((m = wordRegex.exec(text)) !== null) words.push(m[1]);

  const bracketRegex = /\[([^\[\]]+)\]/g;
  const examples = [];
  let m2;
  while ((m2 = bracketRegex.exec(text)) !== null) examples.push(m2[1].trim().replace(/\s+/g, ' '));

  if (words.length === 0 && examples.length === 0) {
    return [guessWordAndExampleFallback(text)];
  }
  const count = Math.max(words.length, examples.length);
  const pairs = [];
  for (let i = 0; i < count; i++) {
    pairs.push({ word: words[i] || '', example: examples[i] || '' });
  }
  return pairs;
}

function showReview(dataUrl) {
  const entries = parseMultipleEntries(ocrRaw).filter(en => en.word && en.example);
  entries.forEach(en => {
    const entry = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), word: en.word, example: en.example, createdAt: Date.now() };
    allWords.push(entry);
    sessionWordIds.push(entry.id);
  });
  saveBank();
  const previewHtml = entries.map(en => `
    <div class="word-row"><div><div class="w">${esc(en.word)}</div><div class="e">${esc(en.example)}</div></div></div>
  `).join('');
  render(`
    <div class="card">
      <div class="empty">✅ ${entries.length}개 단어를 찾아 저장했어요!</div>
      ${entries.length ? previewHtml : '<div class="empty">단어를 찾지 못했어요. 더 선명한 사진으로 다시 찍어보세요.</div>'}
      <div style="height:6px;"></div>
      <button class="btn btn-primary" onclick="goCapture()">📸 계속 찍기</button>
      <button class="btn btn-secondary" onclick="goQuizSetup()">✏️ 바로 퀴즈 풀기</button>
      <button class="btn btn-secondary" onclick="goHome()">처음으로</button>
    </div>
  `);
}

function goWordBank() {
  const rows = allWords.slice().reverse().map(w => `
    <div class="word-row">
      <div><div class="w">${esc(w.word)}</div><div class="e">${esc(w.example)}</div></div>
      <button class="del-btn" onclick="deleteWord('${w.id}')">삭제</button>
    </div>
  `).join('');
  render(`
    <span class="link-back" onclick="goHome()">← 처음으로</span>
    <div class="card">
      ${allWords.length ? rows : '<div class="empty">아직 저장된 단어가 없어요. 사진을 찍어보세요!</div>'}
    </div>
  `);
}

function deleteWord(id) {
  allWords = allWords.filter(w => w.id !== id);
  saveBank();
  goWordBank();
}

function goQuizSetup() {
  const sessionCount = sessionWordIds.length;
  render(`
    <span class="link-back" onclick="goHome()">← 처음으로</span>
    <div class="card">
      <label class="field-label">어떤 단어로 퀴즈를 풀까요?</label>
      <button class="btn btn-primary" ${sessionCount === 0 ? 'disabled' : ''} onclick="startQuiz('session')">
        방금 찍은 단어만 (${sessionCount}개)
      </button>
      <button class="btn btn-secondary" ${allWords.length < 2 ? 'disabled' : ''} onclick="startQuiz('all')">
        지금까지 모은 전체 단어 (${allWords.length}개)
      </button>
      ${allWords.length < 2 ? '<div class="empty">퀴즈를 풀려면 단어가 2개 이상 필요해요</div>' : ''}
    </div>
  `);
}

function shuffle(arr) { return arr.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]); }

function groupByWord(entries) {
  const map = new Map();
  entries.forEach(w => {
    const key = w.word.toLowerCase();
    if (!map.has(key)) map.set(key, { word: w.word, examples: [] });
    map.get(key).examples.push(w.example);
  });
  return Array.from(map.values());
}

function startQuiz(scope) {
  const pool = scope === 'session' ? allWords.filter(w => sessionWordIds.includes(w.id)) : allWords;
  const grouped = groupByWord(pool);
  const allGrouped = groupByWord(allWords);
  if (grouped.length < 2 || allGrouped.length < 2) { alert('단어가 2개 이상 있어야 퀴즈를 만들 수 있어요'); return; }
  quizList = shuffle(grouped).slice(0, Math.min(8, grouped.length));
  quizIndex = 0;
  quizScore = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = quizList[quizIndex];
  const allGrouped = groupByWord(allWords);
  const others = allGrouped.filter(g => g.word.toLowerCase() !== q.word.toLowerCase()).map(g => g.word);
  const distractors = shuffle(others).slice(0, 3);
  const options = shuffle([q.word, ...distractors]);
  const sentencesHtml = q.examples.map(ex => {
    const blanked = ex.replace(new RegExp(q.word, 'ig'), '<span class="blank">ـــــ</span>');
    return `<div class="quiz-sentence-line">${blanked}</div>`;
  }).join('');
  render(`
    <div class="card">
      <div class="quiz-progress">문제 ${quizIndex + 1} / ${quizList.length}${q.examples.length > 1 ? ` · 예문 ${q.examples.length}개` : ''}</div>
      <div class="quiz-sentence">${sentencesHtml}</div>
      <div id="options"></div>
    </div>
  `);
  const optionsEl = document.getElementById('options');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(opt, q.word));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(chosen, answer) {
  const buttons = document.querySelectorAll('#options .option');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === answer) b.classList.add('correct');
    else if (b.textContent === chosen) b.classList.add('wrong');
  });
  if (chosen === answer) quizScore++;
  setTimeout(() => {
    quizIndex++;
    if (quizIndex < quizList.length) renderQuizQuestion();
    else renderQuizResult();
  }, 900);
}

function renderQuizResult() {
  render(`
    <div class="card">
      <div>수고했어요! 🎉</div>
      <div class="result-score">${quizScore} / ${quizList.length}</div>
      <div class="result-label">맞힌 단어 개수예요</div>
      <button class="btn btn-primary" onclick="goQuizSetup()">다시 퀴즈 풀기</button>
      <button class="btn btn-secondary" onclick="goHome()">처음으로</button>
    </div>
  `);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

goHome();
</script>
</body>
</html>
