<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> 정지안 사진으로 만드는 영어단어 퀴즈</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A9BDC">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="포토워드">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<style>
  :root {
    --sky: #3A9BDC; --sky-dark: #2678AE; --sunny: #FFC93C;
    --coral: #FF6B6B; --grass: #4CAF6D; --ink: #26324A; --paper: #F7FAFD; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; }
  .app { max-width:460px; margin:0 auto; padding:20px 18px 60px; }
  header { padding:14px 4px 18px; }
  header .badge { display:inline-block; background:var(--sunny); color:var(--ink); font-weight:800; font-size:13px; padding:4px 10px; border-radius:20px; margin-bottom:8px; }
  header h1 { font-size:22px; font-weight:800; margin:0 0 4px; letter-spacing:-0.5px; }
  header p { margin:0; color:#5A6B85; font-size:14px; line-height:1.5; }

  .card { background:var(--white); border-radius:22px; padding:22px 20px; box-shadow:0 10px 30px rgba(38,50,74,0.08); margin-bottom:16px; }
  .big-btn { display:flex; align-items:center; gap:14px; background:var(--white); border:2px solid #E3ECF6; border-radius:18px; padding:18px 18px; margin-bottom:14px; cursor:pointer; text-align:left; width:100%; }
  .big-btn .icon { font-size:28px; }
  .big-btn .txt h3 { margin:0 0 3px; font-size:16px; }
  .big-btn .txt p { margin:0; font-size:12.5px; color:#7A8AA3; }
  .big-btn:active { transform:scale(0.98); }
  .big-btn.sky { border-color:var(--sky); }
  .big-btn.sunny { border-color:var(--sunny); }

  .btn { display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px; padding:14px 20px; font-size:15px; font-weight:700; cursor:pointer; width:100%; }
  .btn-primary { background:var(--sky); color:var(--white); }
  .btn-secondary { background:#EEF3F9; color:var(--ink); margin-top:10px; }
  .btn:disabled { opacity:.5; }

  input[type=file]{display:none;}
  input[type=text], textarea {
    width:100%; border:2px solid #E3ECF6; border-radius:12px; padding:12px 14px; font-size:15px;
    font-family:inherit; margin-bottom:12px; background:#F7FAFD;
  }
  label.field-label { font-size:12.5px; font-weight:700; color:#5A6B85; margin-bottom:6px; display:block; }

  #preview { width:100%; max-height:220px; object-fit:cover; border-radius:14px; margin-bottom:14px; }

  .status { text-align:center; padding:30px 0; color:#5A6B85; font-size:14px; }
  .spinner { width:30px; height:30px; margin:0 auto 14px; border:3px solid #E3ECF6; border-top-color:var(--sky); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }

  .word-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #EEF3F9; }
  .word-row .w { font-weight:700; }
  .word-row .e { color:#7A8AA3; font-size:12.5px; }
  .del-btn { background:none; border:none; color:var(--coral); font-size:13px; font-weight:700; cursor:pointer; }

  .progress-bar { height:8px; background:#E3ECF6; border-radius:6px; overflow:hidden; margin:10px 0 4px; }
  .progress-fill { height:100%; background:var(--sky); transition:width .2s ease; }

  .quiz-progress { font-size:12.5px; font-weight:700; color:var(--sky-dark); margin-bottom:8px; }
  .quiz-sentence { margin-bottom:20px; }
  .quiz-sentence-line { font-size:18px; font-weight:700; line-height:1.5; margin-bottom:10px; }
  .quiz-sentence-line:last-child { margin-bottom:0; }
  .blank { color:var(--sky-dark); border-bottom:3px solid var(--sky); padding:0 4px; }
  .option { display:block; width:100%; text-align:left; background:#F7FAFD; border:2px solid #E3ECF6; border-radius:14px; padding:13px 16px; margin-bottom:10px; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer; }
  .option.correct { background:#E9F7EE; border-color:var(--grass); color:#256B3E; }
  .option.wrong { background:#FDEBEB; border-color:var(--coral); color:#A33636; }
  .option:disabled { cursor:default; }

  .result-score { font-size:44px; font-weight:800; color:var(--sky-dark); margin:6px 0 2px; text-align:center; }
  .result-label { color:#5A6B85; font-size:14px; margin-bottom:20px; text-align:center; }
  .empty { text-align:center; color:#7A8AA3; font-size:14px; padding:20px 0; }
  .link-back { display:inline-block; margin-bottom:10px; color:var(--sky-dark); font-weight:700; font-size:13.5px; cursor:pointer; }
  .quiz-topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .quiz-topbar .link-back { margin-bottom:0; }
  .wordbank-toolbar { display:flex; gap:8px; margin-bottom:12px; }
  .wordbank-toolbar .btn { margin-top:0; }
  .word-row input[type=checkbox] { width:19px; height:19px; margin-right:10px; flex-shrink:0; }
  .word-row { align-items:flex-start; }
  .word-row .wr-left { display:flex; align-items:flex-start; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="badge">포토워드</span>
    <h1>사진 한 장, 단어 퀴즈 한 판</h1>
    <p>완전 무료 · 인터넷 서버 없이 이 폰 안에서만 작동해요</p>
  </header>
  <div id="screen"></div>
</div>

<script>
const STORAGE_KEY = 'photoword_bank_v1';
let allWords = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let sessionWordIds = [];
let ocrRaw = '';
let quizList = [];
let quizIndex = 0;
let quizScore = 0;

function saveBank() { localStorage.setItem(STORAGE_KEY, JSON.stringify(allWords)); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function render(html) { document.getElementById('screen').innerHTML = html; }

function goHome() {
  render(`
    <div class="big-btn sky" onclick="goCapture()">
      <div class="icon">📷</div>
      <div class="txt"><h3>새 단어 사진 찍기</h3><p>단어와 예문이 있는 사진을 찍어요</p></div>
    </div>
    <div class="big-btn sunny" onclick="goQuizSetup()">
      <div class="icon">✏️</div>
      <div class="txt"><h3>퀴즈 풀기</h3><p>저장된 단어로 문제를 풀어요</p></div>
    </div>
    <div class="big-btn" onclick="goWordBank()">
      <div class="icon">📚</div>
      <div class="txt"><h3>저장된 단어 (${allWords.length}개)</h3><p>모아둔 단어를 확인하고 정리해요</p></div>
    </div>
  `);
}

function goCapture() {
  render(`
    <span class="link-back" onclick="goHome()">← 처음으로</span>
    <div class="card">
      <label class="field-label">단어가 보이는 사진을 준비해주세요</label>
      <input type="file" id="fileInputCamera" accept="image/*" capture="environment">
      <input type="file" id="fileInputGallery" accept="image/*" multiple>
      <button class="btn btn-primary" onclick="document.getElementById('fileInputCamera').click()">📸 새로 사진 찍기</button>
      <button class="btn btn-secondary" onclick="document.getElementById('fileInputGallery').click()">🖼️ 저장된 사진에서 선택 (여러 장 가능)</button>
    </div>
  `);
  document.getElementById('fileInputCamera').addEventListener('change', onPhotos);
  document.getElementById('fileInputGallery').addEventListener('change', onPhotos);
}

function onPhotos(e) {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;
  Promise.all(files.map(readAsDataUrl)).then(processPhotos);
}

function readAsDataUrl(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function preprocessAndSplit(dataUrl, maxW, targetBandHeight) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const main = document.createElement('canvas');
      main.width = w;
      main.height = h;
      const mctx = main.getContext('2d');
      mctx.drawImage(img, 0, 0, w, h);

      // 흑백 + 대비 강화 (배경 비침/형광펜 얼룩 노이즈 완화)
      const imgData = mctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const contrast = 1.5;
      for (let p = 0; p < data.length; p += 4) {
        const gray = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
        let v = (gray - 150) * contrast + 150;
        v = Math.max(0, Math.min(255, v));
        data[p] = data[p + 1] = data[p + 2] = v;
      }
      mctx.putImageData(imgData, 0, 0);

      // 세로로 긴 사진은 여러 구간으로 나눠서 각각 인식 (한 번에 넣으면 아래쪽을 건너뛰는 경우가 있어요)
      const bandCount = Math.max(1, Math.round(h / targetBandHeight));
      const bandH = Math.ceil(h / bandCount);
      const leftFrac = 0.34; // 단어(품사) 열은 대략 왼쪽 34%
      const bands = [];
      for (let i = 0; i < bandCount; i++) {
        const y = i * bandH;
        const bh = Math.min(bandH, h - y);
        if (bh <= 0) continue;

        // 왼쪽: 단어+품사 열
        const leftW = Math.round(w * leftFrac);
        const leftCanvas = document.createElement('canvas');
        leftCanvas.width = leftW;
        leftCanvas.height = bh;
        leftCanvas.getContext('2d').drawImage(main, 0, y, leftW, bh, 0, 0, leftW, bh);

        // 오른쪽: 뜻+예문 열 (경계에서 글자가 잘리지 않도록 살짝 겹치게 시작)
        const rightStart = Math.round(w * leftFrac * 0.92);
        const rightW = w - rightStart;
        const rightCanvas = document.createElement('canvas');
        rightCanvas.width = rightW;
        rightCanvas.height = bh;
        rightCanvas.getContext('2d').drawImage(main, rightStart, y, rightW, bh, 0, 0, rightW, bh);

        bands.push({ left: leftCanvas.toDataURL('image/jpeg', 0.92), right: rightCanvas.toDataURL('image/jpeg', 0.92) });
      }
      resolve(bands);
    };
    img.src = dataUrl;
  });
}

async function processPhotos(dataUrls) {
  const totalPhotos = dataUrls.length;
  let allEntries = [];
  let failedCount = 0;
  let rawTexts = [];

  for (let i = 0; i < totalPhotos; i++) {
    let bands;
    try {
      bands = await preprocessAndSplit(dataUrls[i], 1300, 350);
    } catch (err) {
      failedCount++;
      continue;
    }
    let photoRaw = [];
    let pendingWords = []; // 구간 경계에서 예문을 못 찾은 단어 — 다음 구간 맨 앞 예문과 이어붙임
    for (let j = 0; j < bands.length; j++) {
      render(`
        <div class="card">
          <img id="preview" src="${dataUrls[i]}">
          <div class="status">
            <div class="spinner"></div>
            <div id="ocrMsg">사진 속 글자를 읽는 중이에요 (${i + 1}/${totalPhotos}장 · 구간 ${j + 1}/${bands.length})</div>
            <div class="progress-bar"><div class="progress-fill" id="ocrBar" style="width:0%"></div></div>
          </div>
        </div>
      `);
      try {
        const updateBar = (m) => {
          if (m.status === 'recognizing text') {
            const bar = document.getElementById('ocrBar');
            if (bar) bar.style.width = Math.round(m.progress * 100) + '%';
          }
        };
        // 단어 열과 뜻/예문 열을 따로 인식해서 두 열이 뒤섞여 읽히는 문제를 줄여요
        const [leftResult, rightResult] = await Promise.all([
          Tesseract.recognize(bands[j].left, 'eng', { logger: updateBar }),
          Tesseract.recognize(bands[j].right, 'eng', { logger: () => {} })
        ]);
        const leftText = leftResult.data.text.trim();
        const rightText = rightResult.data.text.trim();
        photoRaw.push(`[단어열]\n${leftText}\n[예문열]\n${rightText}`);

        const words = extractWords(leftText);
        const examples = extractExamples(rightText);

        // 이전 구간에서 예문을 못 찾은 단어를, 이번 구간 맨 앞 예문(들)과 먼저 짝지어요
        while (pendingWords.length > 0 && examples.length > 0) {
          const w = pendingWords.shift();
          const ex = examples.shift();
          allEntries.push({ word: w, example: ex });
        }

        const count = Math.min(words.length, examples.length);
        for (let k = 0; k < count; k++) {
          if (words[k] && examples[k]) allEntries.push({ word: words[k], example: examples[k] });
        }
        if (words.length > count) {
          pendingWords = pendingWords.concat(words.slice(count));
        }
      } catch (err) {
        // 이 구간만 건너뛰고 계속 진행
      }
    }
    rawTexts.push(photoRaw.join('\n---\n'));
  }

  // 같은 단어가 여러 구간 경계에 걸쳐 중복 인식된 경우 정리 (먼저 찾은 것을 우선)
  const seen = new Set();
  const deduped = [];
  allEntries.forEach(en => {
    const key = en.word.toLowerCase();
    if (!seen.has(key)) { seen.add(key); deduped.push(en); }
  });

  saveEntries(deduped, failedCount, rawTexts);
}

function extractWords(text) {
  const wordRegex = /\b([A-Za-z][A-Za-z'\-]{1,20})\s*[^\w\s(]{0,3}\s*\(\s*(v\.?|n\.?|adj\.?|adv\.?|prep\.?|conj\.?|pron\.?|interj\.?)\s*\)/gi;
  const words = [];
  let m;
  while ((m = wordRegex.exec(text)) !== null) words.push(m[1]);
  return words;
}

function extractExamples(text) {
  let normalized = text.replace(/\{/g, '[').replace(/\}/g, ']');
  // 여는 대괄호는 있는데 닫는 대괄호가 없이 세로 막대(|)나 느낌표성 기호로 잘못 읽힌 경우 보정
  normalized = normalized.replace(/\[([^\[\]]*?)[|!](?=\s*(\n|$))/g, '[$1]');
  // 그래도 안 닫힌 대괄호가 있으면, 같은 줄 끝을 닫는 것으로 간주
  normalized = normalized.replace(/\[([^\[\]\n]*?)$/gm, (match, inner) => {
    return inner.trim().length > 0 ? `[${inner}]` : match;
  });
  const bracketRegex = /\[([^\[\]]+)\]/g;
  const examples = [];
  let m;
  while ((m = bracketRegex.exec(normalized)) !== null) examples.push(m[1].trim().replace(/\s+/g, ' '));
  return examples;
}

function saveEntries(entries, failedCount, rawTexts) {
  entries.forEach(en => {
    const entry = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), word: en.word, example: en.example, createdAt: Date.now() };
    allWords.push(entry);
    sessionWordIds.push(entry.id);
  });
  saveBank();
  const previewHtml = entries.map(en => `
    <div class="word-row"><div><div class="w">${esc(en.word)}</div><div class="e">${esc(en.example)}</div></div></div>
  `).join('');
  const rawHtml = (rawTexts || []).map((t, i) => `
    <div style="margin-bottom:10px;"><div style="font-size:11.5px;font-weight:700;color:#7A8AA3;margin-bottom:3px;">사진 ${i + 1}</div><pre style="white-space:pre-wrap;font-size:12px;background:#F7FAFD;border-radius:8px;padding:8px;margin:0;">${esc(t)}</pre></div>
  `).join('');
  render(`
    <div class="card">
      <div class="empty">✅ ${entries.length}개 단어를 찾아 저장했어요!</div>
      ${failedCount ? `<div class="empty">⚠️ ${failedCount}장은 인식에 실패했어요</div>` : ''}
      ${entries.length ? previewHtml : '<div class="empty">단어를 찾지 못했어요. 더 선명한 사진으로 다시 시도해보세요.</div>'}
      <div style="height:6px;"></div>
      <button class="btn btn-primary" onclick="goCapture()">📸 계속 찍기 / 선택하기</button>
      <button class="btn btn-secondary" onclick="goQuizSetup()">✏️ 바로 퀴즈 풀기</button>
      <button class="btn btn-secondary" onclick="goHome()">처음으로</button>
      ${rawHtml ? `<details style="margin-top:14px;"><summary style="font-size:12.5px;color:#7A8AA3;cursor:pointer;">인식된 원문 보기 (문제 진단용)</summary>${rawHtml}</details>` : ''}
    </div>
  `);
}

function goWordBank() {
  const sorted = allWords.slice().reverse();
  const rows = sorted.map(w => `
    <div class="word-row">
      <div class="wr-left">
        <input type="checkbox" class="wb-check" data-id="${w.id}">
        <div><div class="w">${esc(w.word)}</div><div class="e">${esc(w.example)}</div></div>
      </div>
      <button class="del-btn" onclick="deleteWord('${w.id}')">삭제</button>
    </div>
  `).join('');
  render(`
    <span class="link-back" onclick="goHome()">← 처음으로</span>
    <div class="card">
      ${allWords.length ? `
        <div class="wordbank-toolbar">
          <button class="btn btn-secondary" onclick="toggleSelectAll()">전체 선택/해제</button>
          <button class="btn btn-secondary" style="color:var(--coral);" onclick="deleteSelectedWords()">선택 삭제</button>
        </div>
        ${rows}
        <button class="btn btn-secondary" style="color:var(--coral);margin-top:14px;" onclick="deleteAllWords()">전체 삭제</button>
      ` : '<div class="empty">아직 저장된 단어가 없어요. 사진을 찍어보세요!</div>'}
    </div>
  `);
}

function toggleSelectAll() {
  const boxes = document.querySelectorAll('.wb-check');
  const allChecked = Array.from(boxes).every(b => b.checked);
  boxes.forEach(b => { b.checked = !allChecked; });
}

function deleteSelectedWords() {
  const boxes = document.querySelectorAll('.wb-check:checked');
  if (boxes.length === 0) { alert('삭제할 단어를 먼저 선택해주세요'); return; }
  if (!confirm(`선택한 ${boxes.length}개 단어를 삭제할까요?`)) return;
  const idsToDelete = new Set(Array.from(boxes).map(b => b.dataset.id));
  allWords = allWords.filter(w => !idsToDelete.has(w.id));
  saveBank();
  goWordBank();
}

function deleteAllWords() {
  if (!confirm('저장된 단어를 전부 삭제할까요? 되돌릴 수 없어요.')) return;
  allWords = [];
  saveBank();
  goWordBank();
}

function deleteWord(id) {
  allWords = allWords.filter(w => w.id !== id);
  saveBank();
  goWordBank();
}

function goQuizSetup() {
  const sessionCount = sessionWordIds.length;
  render(`
    <span class="link-back" onclick="goHome()">← 처음으로</span>
    <div class="card">
      <label class="field-label">어떤 단어로 퀴즈를 풀까요?</label>
      <button class="btn btn-primary" ${sessionCount === 0 ? 'disabled' : ''} onclick="startQuiz('session')">
        방금 찍은 단어만 (${sessionCount}개)
      </button>
      <button class="btn btn-secondary" ${allWords.length < 2 ? 'disabled' : ''} onclick="startQuiz('all')">
        지금까지 모은 전체 단어 (${allWords.length}개)
      </button>
      ${allWords.length < 2 ? '<div class="empty">퀴즈를 풀려면 단어가 2개 이상 필요해요</div>' : ''}
    </div>
  `);
}

function shuffle(arr) { return arr.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]); }

function groupByWord(entries) {
  const map = new Map();
  entries.forEach(w => {
    const key = w.word.toLowerCase();
    if (!map.has(key)) map.set(key, { word: w.word, examples: [] });
    map.get(key).examples.push(w.example);
  });
  return Array.from(map.values());
}

function startQuiz(scope) {
  const pool = scope === 'session' ? allWords.filter(w => sessionWordIds.includes(w.id)) : allWords;
  const grouped = groupByWord(pool);
  const allGrouped = groupByWord(allWords);
  if (grouped.length < 2 || allGrouped.length < 2) { alert('단어가 2개 이상 있어야 퀴즈를 만들 수 있어요'); return; }
  quizList = shuffle(grouped).slice(0, Math.min(8, grouped.length));
  quizIndex = 0;
  quizScore = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = quizList[quizIndex];
  const allGrouped = groupByWord(allWords);
  const others = allGrouped.filter(g => g.word.toLowerCase() !== q.word.toLowerCase()).map(g => g.word);
  const distractors = shuffle(others).slice(0, 3);
  const options = shuffle([q.word, ...distractors]);
  const sentencesHtml = q.examples.map(ex => {
    const blanked = ex.replace(new RegExp(q.word, 'ig'), '<span class="blank">ـــــ</span>');
    return `<div class="quiz-sentence-line">${blanked}</div>`;
  }).join('');
  render(`
    <div class="quiz-topbar">
      <span class="link-back" onclick="confirmQuitQuiz()">← 홈으로</span>
      <span class="link-back" onclick="skipQuestion()">다음 문제 건너뛰기 →</span>
    </div>
    <div class="card">
      <div class="quiz-progress">문제 ${quizIndex + 1} / ${quizList.length}${q.examples.length > 1 ? ` · 예문 ${q.examples.length}개` : ''}</div>
      <div class="quiz-sentence">${sentencesHtml}</div>
      <div id="options"></div>
    </div>
  `);
  const optionsEl = document.getElementById('options');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(opt, q.word));
    optionsEl.appendChild(btn);
  });
}

function confirmQuitQuiz() {
  if (confirm('퀴즈를 그만두고 홈으로 갈까요? 지금까지의 점수는 저장되지 않아요.')) goHome();
}

function skipQuestion() {
  quizIndex++;
  if (quizIndex < quizList.length) renderQuizQuestion();
  else renderQuizResult();
}

function selectAnswer(chosen, answer) {
  const buttons = document.querySelectorAll('#options .option');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === answer) b.classList.add('correct');
    else if (b.textContent === chosen) b.classList.add('wrong');
  });
  if (chosen === answer) quizScore++;
  setTimeout(() => {
    quizIndex++;
    if (quizIndex < quizList.length) renderQuizQuestion();
    else renderQuizResult();
  }, 900);
}

function renderQuizResult() {
  render(`
    <div class="card">
      <div>수고했어요! 🎉</div>
      <div class="result-score">${quizScore} / ${quizList.length}</div>
      <div class="result-label">맞힌 단어 개수예요</div>
      <button class="btn btn-primary" onclick="goQuizSetup()">다시 퀴즈 풀기</button>
      <button class="btn btn-secondary" onclick="goHome()">처음으로</button>
    </div>
  `);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

goHome();
</script>
</body>
</html>
